<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pin Intelligence</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Login screen (shown until authenticated) -->
  <section id="login-view" class="login-view hidden">
    <form id="login-form" class="login-card" autocomplete="off">
      <h1>Pin Intelligence</h1>
      <p class="login-sub">Enter the password to continue.</p>
      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      />
      <button type="submit" id="login-btn">Log in</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </form>
  </section>

  <!-- App screen (shown after authentication) -->
  <section id="app-view" class="hidden">
    <header class="topbar">
      <h1>Pin Intelligence</h1>
      <span id="mode-badge" class="badge" title="Outbound request mode">…</span>
      <button id="logout-btn" class="ghost-btn" type="button">Log out</button>
    </header>

    <main class="container">
      <!-- Panel 1: Look up a pin -->
      <section class="panel">
        <h2>Look up a pin</h2>
        <form id="pin-form" class="row">
          <input
            id="pin-url"
            type="text"
            placeholder="Paste a pin URL or pin.it link"
            autocomplete="off"
          />
          <button type="submit" id="pin-btn">Look up</button>
        </form>
        <div id="pin-status" class="status" role="status"></div>
        <div id="pin-result" class="result hidden"></div>
      </section>

      <!-- Panel 2: Find similar pins (reverse image search) -->
      <section class="panel">
        <h2>Find similar pins</h2>
        <div id="drop-zone" class="drop-zone">
          <p>Drop an image here, or <span class="link-like">choose a file</span></p>
          <input id="image-input" type="file" accept="image/*" hidden />
        </div>
        <div id="visual-status" class="status" role="status"></div>
        <div id="visual-grid" class="grid hidden"></div>
      </section>
    </main>

    <footer class="footer">
      Personal competitive-research tool. Uses Pinterest's unofficial internal
      endpoints — fragile by nature.
    </footer>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
