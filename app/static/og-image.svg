<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f5f3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- accent bar -->
  <rect x="0" y="0" width="1200" height="10" fill="#e60023"/>

  <!-- pin badge -->
  <rect x="90" y="232" width="120" height="120" rx="28" fill="#e60023"/>
  <path d="M126 268h30c18 0 29 10.5 29 26.5 0 16.5-11.5 27-31 27h-12V392h-16V268z
           M142 305h13c9.5 0 15-5 15-12.5S165 280 155.5 280H142v25z"
        fill="#ffffff"/>

  <!-- title -->
  <text x="250" y="288"
        font-family="'Space Grotesk', 'Segoe UI', sans-serif"
        font-size="76" font-weight="700" fill="#1a1a1a"
        letter-spacing="-2">Pin Intelligence</text>

  <!-- tagline -->
  <text x="252" y="346"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="34" font-weight="500" fill="#6b6661">
    Pinterest pin research &amp; visual search
  </text>

  <!-- feature chips -->
  <g font-family="'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="500">
    <rect x="252" y="392" width="248" height="52" rx="26" fill="#f1ece6" stroke="#d6cfc6"/>
    <text x="276" y="426" fill="#1a1a1a">Saves &amp; reactions</text>

    <rect x="516" y="392" width="300" height="52" rx="26" fill="#f1ece6" stroke="#d6cfc6"/>
    <text x="540" y="426" fill="#1a1a1a">Keyword annotations</text>

    <rect x="832" y="392" width="200" height="52" rx="26" fill="#f1ece6" stroke="#d6cfc6"/>
    <text x="858" y="426" fill="#1a1a1a">Similar pins</text>
  </g>
</svg>
